  <main class="container">
    <h1 class="section-title">Academic Planner</h1>
    <p class="section-subtitle">Keep track of study tasks, assignments, and personal goals.</p>

    <div class="planner-wrapper">
      <form class="planner-form" id="planner-form">
        <input type="text" id="task-input" placeholder="Add a new task..." autocomplete="off">
        <button type="submit" class="btn btn-primary">Add Task</button>
      </form>

      <ul class="task-list" id="task-list"></ul>
      <div class="empty-state" id="empty-state">No tasks yet. Add one above to get started.</div>
    </div>
  </main>
